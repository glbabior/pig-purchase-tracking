# Tests run against an in-memory H2 so they never touch the real file database
# (which the dev server may hold open) and start from a clean schema each run.
spring.datasource.url=jdbc:h2:mem:pigtest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# Never call the Claude API from tests, even when the developer's shell has
# ANTHROPIC_API_KEY set. AI categorization is covered by unit tests that build
# the request without sending it.
pigpurchases.ai.enabled=false
