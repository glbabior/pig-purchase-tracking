# Tests run against an in-memory H2 so they never touch the real file database
# (which the dev server may hold open) and start from a clean schema each run.
spring.datasource.url=jdbc:h2:mem:pigtest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# Never call the Claude API from tests, even when the developer's shell has
# ANTHROPIC_API_KEY set. AI categorization is covered by unit tests that build
# the request without sending it.
pigpurchases.ai.enabled=false

# Don't write backup files to the developer's home during tests.
#
# BOTH settings, for the same belt-and-braces reason the demo profile redirects its backup
# directory as well as disabling backups: `enabled` is NOT sufficient on its own, because
# backupNow() deliberately ignores it. LocalOriginFilterTest posts to /api/backup/now ten
# times — it is the probe for the origin filter, being the one state-changing endpoint that
# needs no request body — and three of those are expected to SUCCEED. With only `enabled`
# set, each of those wrote a dump of the empty in-memory test database over the real daily
# backup in ${user.home}/pigpurchases-backups, under the same one-file-per-day name.
#
# It destroyed real backups on three separate days before anyone noticed, and it is silent:
# onReady() returns early when backups are disabled, so the anti-clobber baseline is never
# seeded, lastGoodRichness stays -1, and the "mapped rows collapsed" guard cannot fire.
# Nothing is logged, nothing is filed .SUSPECT, and the only visible trace is a 7KB file
# where a 120KB one used to be.
pigpurchases.backup.enabled=false
pigpurchases.backup.dir=target/test-backups-default
