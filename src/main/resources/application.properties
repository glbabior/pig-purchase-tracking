spring.application.name=pig-purchases
# The database lives OUTSIDE OneDrive on purpose. OneDrive syncing a live H2
# file corrupts/reverts it (it once restored an older version over the working
# db, losing a session's work). ${user.home}/.pigpurchases is not synced.
spring.datasource.url=jdbc:h2:file:${user.home}/.pigpurchases/pig-purchases-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
# The H2 web console is OFF. It has no password of its own, it fronts a datasource
# whose credentials are three lines above (sa, blank), and the app has no security
# layer to put in front of it — so while it was on, anything able to open a browser
# on this machine had unauthenticated read/write over the financial database plus
# H2's file read/write statements. That is a bigger hole than the whole rest of the
# API. Turn it on deliberately and briefly if you need to inspect the schema:
#   mvnw spring-boot:run -Dspring-boot.run.arguments=--spring.h2.console.enabled=true
spring.h2.console.enabled=false

# Bind to loopback ONLY. Without this Spring Boot binds every interface, so the whole
# API — every amount, every statement PDF, and every state-changing POST — was reachable
# from anything that could route to this machine. LocalOriginFilter does not cover that:
# it allows a request carrying neither Origin nor Referer, on the reasoning that only
# local tooling sends neither, and that reasoning is only true when the socket is local.
# A curl from another machine on the network sends neither header. The filter guards
# against a hostile PAGE; this line is what makes "requests must come from this machine"
# true of the socket. Both are needed.
server.address=127.0.0.1

# Local app: never cache the UI, so edits always show on refresh
spring.web.resources.cache.cachecontrol.no-store=true

# Automatic database backups (see BackupService). Backups are consistent SQL
# dumps written OUTSIDE OneDrive and outside the live-db folder, so whatever can
# revert/corrupt the live db can't touch the backup history. One file per day,
# named by date; refreshed during the day only when the data actually changed.
# Retention (how many daily files to keep) is configurable in Settings.
pigpurchases.backup.enabled=true
pigpurchases.backup.dir=${user.home}/pigpurchases-backups
pigpurchases.backup.interval-ms=600000
# Fallback retention if the settings row can't be read; Settings overrides this.
pigpurchases.backup.default-keep=30

# DevTools watches target/classes. With a trigger file it restarts ONLY when
# that file changes, not on every .class write. The in-app "Rebuild & restart"
# recompiles first, then touches target/classes/.reloadtrigger, so exactly one
# restart fires (instead of the compile's class writes also triggering one).
spring.devtools.restart.trigger-file=.reloadtrigger

# AI categorization of the transactions hint-matching can't resolve.
# Credentials come from the environment (ANTHROPIC_API_KEY) or an `ant auth
# login` profile; with neither, the pass is skipped and those transactions stay
# parked as "Other". Only descriptions and vendor names are ever sent.
# Each answer is remembered per merchant, so a given merchant is only ever paid
# for once — later runs reuse the stored answer for free.
# Haiku is the default: this is a simple merchant->category classification, and
# Haiku is ~5x cheaper than Opus. Switch to claude-opus-4-8 if accuracy needs it.
pigpurchases.ai.enabled=true
pigpurchases.ai.model=claude-haiku-4-5
pigpurchases.ai.batch-size=40
