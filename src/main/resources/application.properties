spring.application.name=pig-purchases
spring.datasource.url=jdbc:h2:file:./pig-purchases-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Local app: never cache the UI, so edits always show on refresh
spring.web.resources.cache.cachecontrol.no-store=true

# AI categorization of the transactions hint-matching can't resolve.
# Credentials come from the environment (ANTHROPIC_API_KEY) or an `ant auth
# login` profile; with neither, the pass is skipped and those transactions stay
# parked as "Other". Only descriptions and vendor names are ever sent.
pigpurchases.ai.enabled=true
pigpurchases.ai.model=claude-opus-4-8
pigpurchases.ai.batch-size=40
