# Demonstration mode: .\demo.cmd
#
# Everything here points somewhere disposable. The whole reason this profile exists is
# that a demo must not be able to touch real data, and pointing the datasource somewhere
# else is NOT enough on its own: the backup scheduler is configured independently, so a
# demo left on the default backup directory would write dumps of the demo database over
# the real daily backup, under the same one-file-per-day name.

# A separate database, in a separate folder from the live one.
spring.datasource.url=jdbc:h2:file:${user.home}/.pigpurchases-demo/demo-db

# Backups off, and pointed away from the real backup history even so. Nothing in a
# demo is worth backing up, and the belt-and-braces second setting means turning
# backups back on to try that screen still cannot reach real files.
pigpurchases.backup.enabled=false
pigpurchases.backup.dir=${user.home}/.pigpurchases-demo/backups

# No outbound API calls. Demo statements are written so the deterministic hint pass
# places most of them, which is the more interesting thing to show anyway: the
# remainder land in "Other" and demonstrate the parked bucket and manual review.
pigpurchases.ai.enabled=false

# Where the generated sample statements are written, and the folder the seeded
# statement source points at.
pigpurchases.demo.dir=${user.home}/.pigpurchases-demo/statements
